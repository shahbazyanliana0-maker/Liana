<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codigo — Login</title>

<link rel="stylesheet" href="style.css">

<style>
.auth-page{
    min-height:calc(100vh - 80px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
}

.auth-box{
    width:100%;
    max-width:470px;
    background:#111816;
    border:1px solid #26332f;
    border-radius:24px;
    padding:42px;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.auth-logo{
    text-align:center;
    margin-bottom:30px;
}

.auth-logo h1{
    font-size:34px;
    color:#fff;
    margin-bottom:8px;
}

.auth-logo h1 span{
    color:#34d399;
}

.auth-logo p{
    color:#8c9b96;
    font-size:15px;
}

.auth-tabs{
    display:flex;
    background:#0b0f0e;
    border-radius:12px;
    padding:4px;
    margin-bottom:28px;
}

.auth-tab{
    flex:1;
    border:0;
    background:transparent;
    color:#8c9b96;
    padding:12px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.auth-tab.active{
    background:#34d399;
    color:#07110e;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    color:#d9e4df;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:14px 15px;
    border-radius:10px;
    border:1px solid #2b3935;
    background:#0b0f0e;
    color:#fff;
    outline:none;
    font-size:15px;
}

.form-group input:focus{
    border-color:#34d399;
}

.auth-button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:11px;
    background:#34d399;
    color:#07110e;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
}

.auth-button:hover{
    background:#6ee7b7;
}

.auth-message{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    background:#12352b;
    color:#6ee7b7;
    text-align:center;
    font-size:14px;
}

.auth-footer{
    text-align:center;
    margin-top:25px;
    color:#71807b;
    font-size:13px;
}

.auth-footer a{
    color:#34d399;
    text-decoration:none;
}

.password-note{
    margin-top:6px;
    color:#687772;
    font-size:12px;
}

@media(max-width:600px){
    .auth-box{
        padding:28px 22px;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <span>&lt;</span>Codigo<span>/&gt;</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="index.html#features">Features</a>
            <a href="pricing.html">Pricing</a>
        </div>

        <a href="login.html" class="nav-button">Get Started</a>
    </div>
</nav>

<main class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            <h1>Welcome to <span>Codigo</span></h1>
            <p>Continue your coding journey.</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab" onclick="showLogin()">
                Log In
            </button>

            <button class="auth-tab" id="signupTab" onclick="showSignup()">
                Sign Up
            </button>
        </div>

        <!-- LOGIN -->

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="auth-button">
                Log In
            </button>

        </form>

        <!-- SIGN UP -->

        <form id="signupForm" style="display:none;">

            <div class="form-group">
                <label>Your Name</label>
                <input
                    type="text"
                    id="signupName"
                    placeholder="Your name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <div class="password-note">
                    Use at least 6 characters.
                </div>
            </div>

            <button type="submit" class="auth-button">
                Create Account
            </button>

        </form>

        <div class="auth-message" id="message"></div>

        <div class="auth-footer">
            By continuing, you agree to Codigo's terms and conditions.
        </div>

    </div>

</main>

<footer class="footer">
    <div class="container">
        <p>© 2026 Codigo. Learn. Build. Create.</p>
    </div>
</footer>

<script>

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const message = document.getElementById("message");

function showLogin(){

    loginForm.style.display = "block";
    signupForm.style.display = "none";

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

    message.style.display = "none";
}

function showSignup(){

    loginForm.style.display = "none";
    signupForm.style.display = "block";

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    message.style.display = "none";
}


// SIGN UP

signupForm.addEventListener("submit", function(e){

    e.preventDefault();

    const name = document.getElementById("signupName").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;

    const user = {
        name:name,
        email:email,
        password:password
    };

    localStorage.setItem("codigoUser", JSON.stringify(user));

    localStorage.setItem("codigoLoggedIn", "true");

    message.textContent =
        "Account created successfully! Redirecting...";

    message.style.display = "block";

    setTimeout(function(){
        window.location.href = "dashboard.html";
    }, 1000);

});


// LOGIN

loginForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const savedUser =
        JSON.parse(localStorage.getItem("codigoUser"));

    if(!savedUser){

        message.textContent =
            "No account found. Please create an account first.";

        message.style.display = "block";

        return;
    }

    if(
        email === savedUser.email &&
        password === savedUser.password
    ){

        localStorage.setItem("codigoLoggedIn","true");

        message.textContent =
            "Login successful! Redirecting...";

        message.style.display = "block";

        setTimeout(function(){
            window.location.href = "dashboard.html";
        },1000);

    }else{

        message.textContent =
            "Incorrect email or password.";

        message.style.display = "block";
    }

});

</script>

</body>
</html>
